# Avaldab saidi Firebase Hostingu live-kanalisse (projekt kauge32-elekter).
# Algselt loodud Firebase CLI-ga (`firebase init hosting:github`), nüüd käsitsi muudetud: ära lase CLI-l seda
# faili üle kirjutada, muidu kaovad allolevad käivitajad, õigused ja SHA-ga lukustatud tegevused.
#
# Käivitajad:
#   push main-i          – inimese push või PR-i ühendamine.
#   repository_dispatch  – sündmus `andmed-uuendatud`: andmetöövood (uuenda-hinnad.yml, uuenda-paike.yml) saadavad selle
#                          ainult pärast andmefailide commit'i õnnestunud push'i. GITHUB_TOKEN-iga tehtud push ei käivita
#                          GitHubi reeglite järgi uut töövoogu (ka mitte allolevat push-käivitajat), repository_dispatch aga
#                          käivitab ja vajab saatjalt ainult juba olemasolevat õigust `contents: write`. Muutuseta
#                          käivitused sündmust ei saada, seega neist avaldamist ei tule.
#   workflow_dispatch    – käsitsi uuesti avaldamine (Run workflow), ainult harust main.

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [andmed-uuendatud]
  workflow_dispatch:

permissions: {}

jobs:
  build_and_deploy:
    # repository_dispatch käivitub alati vaikeharul (main); käsitsi käivitus teisest harust ei tohi live'i avaldada
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Korraga üks avaldamine, ootel ainult viimane (uuem ootel käivitus tühistab vanema ootel käivituse). Nii ei saa vanema
    # seisuga avaldamine lõppeda pärast uuemat; tühistatud käivituse commit jõuab live'i järgmise käivitusega.
    # Töö tasemel, et vahele jäetud (mitte-main) käivitus ootel avaldamist ei tühistaks.
    concurrency:
      group: firebase-hosting-live
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Võta repositoorium
        # Commit'i SHA-ga, mitte sildiga (silti saab ümber tõsta). persist-credentials: false – token ei jää .git/config-i.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          # Haru uusim seis, mitte sündmuse commit: järjekorras oodanud käivitus avaldab ka vahepeal lisandunud andmed
          ref: ${{ github.ref_name }}
     # - run: npm ci && npm run build
      - name: Avalda live-kanalisse
        # Commit'i SHA-ga, sest tegevus saab Firebase'i teenusekonto võtme (silt v0 osutas sellele commit'ile 2026-11-03).
        # repoToken'it ei anta: live-avaldamisel tegevus GitHubi API-t ei kasuta (check ja kommentaar ainult PR-i eelvaates).
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a  # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KAUGE32_ELEKTER }}
          channelId: live
          projectId: kauge32-elekter
